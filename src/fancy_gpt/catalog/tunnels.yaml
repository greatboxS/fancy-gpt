tunnels:
  - id: chrome-extension-native-local
    description: Existing local Google Chrome session through the FancyGPT extension and Native Messaging.
    site: chatgpt
    runtime: extension
    transport: native-messaging
    scope: local
    browser: chrome
    priority: 10
    endpoint: ws://127.0.0.1:8765
    tags: [extension, native, local, existing-session]
    capabilities:
      automatic: true
      existing_session: true
      persistent_session: true
      requires_extension: true
      requires_bridge: true
      requires_native_host: true
      browser_families: [chrome]

  - id: edge-extension-native-local
    description: Existing local Microsoft Edge session through the FancyGPT extension and Native Messaging.
    site: chatgpt
    runtime: extension
    transport: native-messaging
    scope: local
    browser: edge
    priority: 11
    endpoint: ws://127.0.0.1:8765
    tags: [extension, native, local, existing-session]
    capabilities:
      automatic: true
      existing_session: true
      persistent_session: true
      requires_extension: true
      requires_bridge: true
      requires_native_host: true
      browser_families: [edge]

