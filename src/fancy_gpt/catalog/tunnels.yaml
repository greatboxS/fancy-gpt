    transport: native-messaging
    scope: local
    browser: firefox
    priority: 12
    endpoint: ws://127.0.0.1:8765
    tags: [extension, native, local, existing-session]
    capabilities:
      automatic: true
      existing_session: true
      persistent_session: true
      requires_extension: true
      requires_bridge: true
      requires_native_host: true
      browser_families: [firefox]

  - id: chrome-extension-ws-remote
    description: Chrome on a workstation connected to a remote FancyGPT host over WebSocket, normally carried through SSH local forwarding.
    site: chatgpt
    runtime: extension
    transport: websocket
    scope: remote
    browser: chrome
    priority: 20
    endpoint: ws://127.0.0.1:8765
    tags: [extension, websocket, remote, ssh, existing-session]
    capabilities:
      automatic: true
      remote_capable: true
      existing_session: true
      persistent_session: true
      requires_extension: true
      requires_bridge: true
      supports_ssh_forward: true
      browser_families: [chrome]

  - id: edge-extension-ws-remote
    description: Edge on a workstation connected to a remote FancyGPT host over WebSocket, normally carried through SSH local forwarding.
    site: chatgpt
    runtime: extension
    transport: websocket
    scope: remote
    browser: edge
    priority: 21
    endpoint: ws://127.0.0.1:8765
    tags: [extension, websocket, remote, ssh, existing-session]
    capabilities:
      automatic: true
      remote_capable: true
      existing_session: true
      persistent_session: true
      requires_extension: true
      requires_bridge: true
      supports_ssh_forward: true
      browser_families: [edge]

  - id: firefox-extension-ws-remote
    description: Firefox on a workstation connected to a remote FancyGPT host over WebSocket, normally carried through SSH local forwarding.
    site: chatgpt
    runtime: extension
    transport: websocket
    scope: remote
    browser: firefox
    priority: 22
