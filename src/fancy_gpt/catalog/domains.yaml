  - repo.search
  - web.search
  - web.open
  functional_focus:
  - topology roles pairing and provisioning
  - link budget bandwidth latency and loss
  - transport assumptions over RF
  - vendor module configuration
  - runtime RF evidence
- name: productization
  description: Prototype-to-production architecture, maintainability, observability,
