<!doctype html><html><head><meta charset="utf-8"><style>
:root{
  --bg:#111318;--field:#1b1e26;--border:#2a2e38;
  --text:#e4e6eb;--muted:#8a8f9c;--accent:#6c7bff;--ok:#3ddc97;--bad:#ff6b6b;
}
*{box-sizing:border-box}
body{
  margin:0;width:300px;padding:12px;
  font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:#e4e6eb;
}
h1{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.2px;color:var(--text)}
label{display:block;margin:8px 0 3px;color:var(--muted);font-size:11px}
input,select{
  width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border);
  background:var(--field);color:var(--text);font-size:12px;outline:none;
}
input:focus,select:focus{border-color:var(--accent)}
label.inline{display:flex;align-items:center;gap:6px;margin:10px 0 0;font-size:11px;color:var(--muted);cursor:pointer}
label.inline input{width:auto;margin:0;cursor:pointer}
button{
  width:100%;margin-top:10px;padding:7px;border:none;border-radius:6px;
  background:var(--accent);color:#fff;font-size:12px;cursor:pointer;
}
button:hover{opacity:.9}
hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.status-head{display:flex;align-items:center;gap:6px;margin-bottom:4px;color:var(--muted);font-size:11px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.dot.connected{background:var(--ok)}
.dot.disconnected{background:var(--bad)}
pre{
  white-space:pre-wrap;word-break:break-word;margin:0;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;
  color:var(--muted);max-height:110px;overflow:auto;
}
</style></head><body>
<h1>FancyGPT Tunnel</h1>

<label>Transport</label>
<select id="transport"><option value="websocket">WebSocket / SSH</option><option value="native">Native Messaging</option></select>
<label>Bridge endpoint</label><input id="endpoint" value="ws://127.0.0.1:8765">
<label>Pair token</label><input id="token" type="password" placeholder="paste pairing token">
<label>Tunnel ID</label><input id="tunnelId" value="edge-extension-ws-remote">
<label>Browser</label><input id="browserName" value="edge">
<label class="inline"><input id="autoConnect" type="checkbox" checked> Auto reconnect when disconnected</label>
<button id="save">Save &amp; reconnect</button>

<hr>
<div class="status-head"><span class="dot" id="statusBadge"></span>Status</div>
<pre id="status">…</pre>

<script src="popup.js"></script></body></html>
