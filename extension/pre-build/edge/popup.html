<!doctype html><html><head><meta charset="utf-8"><style>
:root{
  --bg:#111318;--field:#1b1e26;--border:#2a2e38;
  --text:#e4e6eb;--muted:#8a8f9c;--accent:#2f8f5b;--ok:#3ddc97;--bad:#ff6b6b;--warn:#e0a52e;
}
*{box-sizing:border-box}
body{
  margin:0;width:260px;padding:10px;
  font:11px/1.35 "Segoe UI Variable","Segoe UI",-apple-system,"SF Pro Text",Ubuntu,Roboto,sans-serif;
  background:var(--bg);color:#e4e6eb;
}
h1{margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.2px;color:var(--text)}
label{display:block;margin:6px 0 2px;color:var(--muted);font-size:10px}
input,select{
  width:100%;padding:5px 7px;border-radius:5px;border:1px solid var(--border);
  background:var(--field);color:var(--text);font-size:11px;font-family:inherit;outline:none;
}
input:focus,select:focus{border-color:var(--accent)}
label.inline{display:flex;align-items:center;gap:5px;margin:8px 0 0;font-size:10px;color:var(--muted);cursor:pointer}
label.inline input{width:auto;margin:0;cursor:pointer}
button{
  width:100%;margin-top:8px;padding:6px;border:none;border-radius:5px;
  background:var(--accent);color:#fff;font-size:11px;font-family:inherit;cursor:pointer;
}
button:hover{opacity:.9}
button:active{transform:scale(.98)}
button:disabled{opacity:.6;cursor:default}
hr{border:none;border-top:1px solid var(--border);margin:10px 0}
.status-row{display:flex;align-items:center;gap:7px}
.indicator{position:relative;width:8px;height:8px;flex:none}
.dot{position:absolute;inset:1px;border-radius:50%;background:var(--muted);transition:background .2s ease}
.dot.connected{background:var(--ok);box-shadow:0 0 5px var(--ok)}
.dot.disconnected{background:var(--muted)}
.dot.failed{background:var(--bad);box-shadow:0 0 5px var(--bad)}
.spinner{position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--warn);display:none}
.spinner.active{display:block;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{
  10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(2px)}
  30%,50%,70%{transform:translateX(-3px)} 40%,60%{transform:translateX(3px)}
}
.status-row.shake{animation:shake .4s ease}
#statusText{font-size:11px;font-weight:600;color:var(--text);transition:color .2s ease}
#statusText.failed{color:var(--bad)}
#statusDetail{margin:2px 0 0 15px;font-size:10px;color:var(--muted);min-height:12px}
</style></head><body>
<h1>FancyGPT Tunnel</h1>

<label>Transport</label>
<select id="transport"><option value="websocket">WebSocket / SSH</option><option value="native">Native Messaging</option></select>
<label>Bridge endpoint</label><input id="endpoint" value="ws://127.0.0.1:8765">
<label>Pair token</label><input id="token" type="password" placeholder="paste pairing token">
<label>Tunnel ID</label><input id="tunnelId" value="edge-remote">
<label>Browser</label><input id="browserName" value="edge">
<label class="inline"><input id="autoConnect" type="checkbox" checked> Auto reconnect when disconnected</label>
<label class="inline"><input id="separateTaskWindow" type="checkbox"> Run tasks in a separate minimized window</label>
<button id="save">Save &amp; reconnect</button>

<hr>
<div class="status-row" id="statusRow">
  <span class="indicator"><span class="spinner" id="statusSpinner"></span><span class="dot" id="statusBadge"></span></span>
  <span id="statusText">Checking…</span>
</div>
<div id="statusDetail"></div>

<script src="popup.js"></script></body></html>
